<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#2f3a46">
<title>Самара — карта магазинов</title>
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script>
(function(){
  if (window.maplibregl) return;
  var cdns = [
    'https://cdn.jsdelivr.net/npm/maplibre-gl@4.7.1/dist/',
    'https://cdnjs.cloudflare.com/ajax/libs/maplibre-gl/4.7.1/'
  ];
  for (var i = 0; i < cdns.length && !window.maplibregl; i++){
    document.write('<link rel="stylesheet" href="' + cdns[i] + 'maplibre-gl.css">');
    document.write('<script src="' + cdns[i] + 'maplibre-gl.js"><\/script>');
  }
})();
</script>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { height:100%; overflow:hidden; overscroll-behavior:none; }
  body {
    font-family:-apple-system, Roboto, "Segoe UI", sans-serif;
    background:var(--bg); color:var(--text);
    -webkit-user-select:none; user-select:none; -webkit-touch-callout:none;
  }
  :root {
    --bg:#f4f6f8; --panel:#ffffff; --panel2:#eef1f4; --text:#17181a; --muted:#6b7280;
    --chip:#e8ecf0; --chip-on:#1976d2; --line:#d7dce2; --sheet:#ffffff;
    --toast:#202124; --toast-text:#ffffff; --accent:#1976d2; --topbar-h:110px;
  }
  [data-theme="dark"] {
    --bg:#2b3540; --panel:#2f3a46; --panel2:#37424f; --text:#e6ebf1; --muted:#9aa7b4;
    --chip:#3a4552; --chip-on:#1976d2; --line:#46525f; --sheet:#2f3a46; --toast:#11161c;
  }
  input, textarea { -webkit-user-select:text; user-select:text; font-family:inherit; }
  button { font-family:inherit; border:none; background:none; color:inherit; cursor:pointer; }
  button:active { transform:scale(0.95); }
  svg { display:block; }

  #map { position:fixed; inset:0; width:100%; height:100vh; height:100dvh; z-index:0; }
  #fatal { position:fixed; inset:0; z-index:99; display:none; align-items:center; justify-content:center;
    background:var(--bg); color:var(--text); padding:24px; text-align:center; font-size:15px; line-height:1.5; overflow-y:auto; }
  #fatal > div { max-width:420px; width:100%; }

  #topbar { position:fixed; top:0; left:0; right:0; z-index:20; background:var(--panel);
    padding:calc(env(safe-area-inset-top) + 8px) 10px 8px; box-shadow:0 2px 10px rgba(0,0,0,.18);
    transition:padding .25s ease; }
  #topbar.collapsed { padding-bottom:6px; }
  .tb-row1 { display:flex; align-items:center; gap:8px; }
  #tbTitle { font-size:14px; font-weight:700; white-space:nowrap; flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; }
  #topbar:not(.collapsed) #tbTitle { display:none; }
  .searchwrap { position:relative; flex:1; min-width:0; }
  .searchwrap svg { position:absolute; left:10px; top:50%; transform:translateY(-50%); color:var(--muted); pointer-events:none; }
  #search { width:100%; height:44px; border-radius:12px; border:1px solid var(--line);
    background:var(--panel2); color:var(--text); padding:0 12px 0 34px; font-size:15px; outline:none; }
  .ibtn { width:44px; height:44px; min-width:44px; border-radius:12px; background:var(--panel2);
    display:flex; align-items:center; justify-content:center; color:var(--text); }
  #btnCollapse { transition:transform .25s ease; }
  #topbar.collapsed #btnCollapse { transform:rotate(180deg); }
  .tb-row2 { display:flex; flex-wrap:wrap; gap:6px; margin-top:8px; overflow:hidden;
    max-height:200px; transition:max-height .25s ease, margin .25s ease, opacity .25s ease; opacity:1; }
  #topbar.collapsed .tb-row2 { max-height:0; margin-top:0; opacity:0; pointer-events:none; }
  #topbar.collapsed .searchwrap { display:none; }
  .chip { min-height:44px; padding:0 14px; border-radius:22px; background:var(--chip); color:var(--text);
    font-size:13px; font-weight:600; display:flex; align-items:center; gap:6px; }
  .chip.on { background:var(--chip-on); color:#fff; }

  #drop { position:fixed; left:10px; right:10px; top:calc(var(--topbar-h) + 4px); z-index:19;
    background:var(--panel); border-radius:14px; box-shadow:0 6px 24px rgba(0,0,0,.25); display:none; overflow:hidden; }
  .drop-row { min-height:44px; padding:8px 14px; display:flex; flex-direction:column; justify-content:center; }
  .drop-row:active { background:var(--panel2); }
  .drop-row b { font-size:14px; } .drop-row span { font-size:12px; color:var(--muted); }

  .ctl { position:fixed; z-index:10; display:flex; flex-direction:column; gap:8px; top:calc(var(--topbar-h) + 8px);
    transition:top .25s ease; }
  .ctl-left { left:10px; } .ctl-right { right:10px; }
  .cbtn { width:44px; height:44px; border-radius:12px; background:var(--panel); color:var(--text);
    box-shadow:0 2px 8px rgba(0,0,0,.25); display:flex; align-items:center; justify-content:center; }
  #btnLocate { position:fixed; right:14px; bottom:calc(16px + env(safe-area-inset-bottom)); z-index:10;
    width:56px; height:56px; border-radius:50%; background:#1976d2; color:#fff;
    box-shadow:0 4px 14px rgba(0,0,0,.35); display:flex; align-items:center; justify-content:center; }
  #btnLocate.trk { animation:trkPulse 1.6s infinite; }
  @keyframes trkPulse { 0%{box-shadow:0 0 0 0 rgba(25,118,210,.55);} 70%{box-shadow:0 0 0 16px rgba(25,118,210,0);} 100%{box-shadow:0 0 0 0 rgba(25,118,210,0);} }
  #btnCompass[hidden] { display:none; }

  #geoBanner { position:fixed; left:10px; right:84px; bottom:calc(16px + env(safe-area-inset-bottom)); z-index:12;
    background:var(--panel); color:var(--text); border-radius:14px; padding:10px 12px; display:none;
    align-items:center; gap:8px; box-shadow:0 4px 18px rgba(0,0,0,.3); font-size:13px; line-height:1.35; }
  #geoBanner span { flex:1; }
  #geoBanner .btn { flex:none; min-height:40px; padding:0 14px; }
  #geoBanner .ibtn { width:36px; height:36px; min-width:36px; font-size:20px; }

  .sm { position:relative; width:34px; height:34px; cursor:pointer; }
  .sm .pin { width:34px; height:34px; transform:rotate(-45deg); border-radius:50% 50% 50% 0;
    box-shadow:0 2px 6px rgba(0,0,0,.4); display:flex; align-items:center; justify-content:center; }
  .sm .pin svg { transform:rotate(45deg); color:#fff; }
  .pin-magnit { background:#d32f2f; } .pin-pyat { background:#2e7d32; }
  .bdg { position:absolute; width:20px; height:20px; border-radius:50%; display:flex;
    align-items:center; justify-content:center; border:1.5px solid #fff; }
  .b-cam { top:-5px; right:-7px; background:#000; color:#fff; }
  .b-visit { bottom:-3px; right:-7px; background:#2e7d32; color:#fff; }
  .b-note { bottom:-1px; left:-7px; width:13px; height:13px; background:#1976d2; }
  .bdg.off { display:none; }
  .umark { width:36px; height:36px; border-radius:50%; background:#1976d2; color:#fff; border:2px solid #fff;
    box-shadow:0 2px 8px rgba(0,0,0,.35); display:flex; align-items:center; justify-content:center; cursor:pointer; }
  .geodot { width:18px; height:18px; border-radius:50%; background:#1976d2; border:3px solid #fff;
    box-shadow:0 0 10px rgba(0,0,0,.45); position:relative; }
  .geodot.live::after { content:""; position:absolute; inset:-10px; border-radius:50%;
    border:2px solid rgba(25,118,210,.7); animation:dotPulse 1.6s infinite; }
  @keyframes dotPulse { 0%{transform:scale(.5); opacity:1;} 100%{transform:scale(1.4); opacity:0;} }

  #lpPulse { position:fixed; z-index:15; width:46px; height:46px; margin:-23px 0 0 -23px; border-radius:50%;
    background:rgba(25,118,210,.3); border:2px solid #1976d2; display:none; animation:lpA .9s infinite; pointer-events:none; }
  @keyframes lpA { 0%{transform:scale(.55); opacity:1;} 100%{transform:scale(1.15); opacity:.2;} }

  #overlay { position:fixed; inset:0; z-index:35; background:rgba(0,0,0,.45); display:none; }
  .sheet { position:fixed; left:0; right:0; bottom:0; z-index:40; background:var(--sheet); color:var(--text);
    border-radius:18px 18px 0 0; transform:translateY(105%); transition:transform .28s ease;
    max-height:84vh; max-height:84dvh; overflow-y:auto; padding:14px 14px calc(14px + env(safe-area-inset-bottom));
    box-shadow:0 -6px 30px rgba(0,0,0,.3); visibility:hidden; }
  .sheet.open { transform:none; visibility:visible; }
  .sh-head { display:flex; align-items:center; gap:8px; margin-bottom:10px; }
  .sh-head h2 { font-size:19px; flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .sh-sub { font-size:13px; color:var(--muted); margin:-6px 0 10px; }
  .addr { font-size:14px; color:var(--muted); margin-bottom:10px; }
  textarea, .inp { width:100%; border:1px solid var(--line); background:var(--panel2); color:var(--text);
    border-radius:12px; padding:10px 12px; font-size:15px; outline:none; resize:vertical; }
  textarea { min-height:76px; }
  .lbl { font-size:13px; color:var(--muted); margin:10px 0 6px; }
  .ck { display:flex; align-items:center; gap:10px; min-height:44px; padding:8px 12px; margin-top:10px;
    border:2px solid var(--line); border-radius:12px; font-size:14px; font-weight:600; }
  .ck input { display:none; }
  .ck .box { width:22px; height:22px; min-width:22px; border-radius:6px; border:2px solid var(--muted);
    display:flex; align-items:center; justify-content:center; color:#fff; }
  .ck.cam-on { border-color:#d32f2f; } .ck.cam-on .box { background:#d32f2f; border-color:#d32f2f; }
  .ck.vis-on { border-color:#2e7d32; } .ck.vis-on .box { background:#2e7d32; border-color:#2e7d32; }
  .row2 { display:flex; gap:8px; margin-top:10px; }
  .btn { min-height:48px; flex:1; border-radius:12px; background:var(--chip); color:var(--text);
    font-size:14px; font-weight:700; display:flex; align-items:center; justify-content:center; gap:8px; padding:0 10px; }
  .btn.primary { background:var(--accent); color:#fff; }
  .btn.danger { background:#d32f2f; color:#fff; }
  .meta { font-size:12px; color:var(--muted); margin-top:10px; }
  .ph-grid { display:flex; flex-wrap:wrap; gap:8px; margin-top:8px; }
  .ph { position:relative; width:84px; height:84px; border-radius:10px; overflow:visible; }
  .ph img { width:84px; height:84px; border-radius:10px; object-fit:cover; background:var(--panel2); }
  .ph-x { position:absolute; top:-8px; right:-8px; width:44px; height:44px; display:flex;
    align-items:center; justify-content:center; }
  .ph-x span { width:24px; height:24px; border-radius:50%; background:#202124; color:#fff;
    display:flex; align-items:center; justify-content:center; }
  .seg { display:flex; background:var(--chip); border-radius:12px; padding:4px; gap:4px; }
  .seg button { flex:1; min-height:44px; border-radius:9px; font-size:13px; font-weight:700; color:var(--text); }
  .seg button.on { background:var(--accent); color:#fff; }
  .swrow { display:flex; align-items:center; justify-content:space-between; min-height:44px; margin-top:12px; font-size:14px; font-weight:600; }
  .sw { width:52px; height:30px; min-width:52px; border-radius:15px; background:var(--chip); position:relative; transition:.2s; }
  .sw::after { content:""; position:absolute; top:3px; left:3px; width:24px; height:24px; border-radius:50%;
    background:#fff; transition:.2s; box-shadow:0 1px 4px rgba(0,0,0,.3); }
  .sw.on { background:#2e7d32; } .sw.on::after { left:25px; }
  .diag { margin-top:12px; font-size:12px; color:var(--muted); line-height:1.7;
    background:var(--panel2); border-radius:10px; padding:10px 12px; word-break:break-word; }

  .icgrid { display:grid; grid-template-columns:repeat(4, 1fr); gap:8px; margin-top:8px; }
  .ic { height:56px; border-radius:12px; background:var(--chip); color:var(--text);
    display:flex; align-items:center; justify-content:center; transition:transform .12s; }
  .ic.store-m { background:#d32f2f; color:#fff; } .ic.store-p { background:#2e7d32; color:#fff; }
  .ic.sel { outline:3px solid var(--accent); transform:scale(1.08); }

  #viewer { position:fixed; inset:0; z-index:60; background:rgba(0,0,0,.92); display:none;
    align-items:center; justify-content:center; }
  #viewer.open { display:flex; }
  #viewer img { max-width:96vw; max-height:82vh; border-radius:8px; }
  .vbtn { position:fixed; width:48px; height:48px; border-radius:50%; background:rgba(255,255,255,.14);
    color:#fff; display:flex; align-items:center; justify-content:center; }
  #vClose { top:calc(10px + env(safe-area-inset-top)); right:10px; }
  #vPrev { left:8px; top:50%; transform:translateY(-50%); }
  #vNext { right:8px; top:50%; transform:translateY(-50%); }

  #toast { position:fixed; left:50%; bottom:calc(28px + env(safe-area-inset-bottom)); transform:translateX(-50%) translateY(20px);
    z-index:70; background:var(--toast); color:var(--toast-text); font-size:14px; font-weight:600;
    padding:12px 18px; border-radius:12px; opacity:0; pointer-events:none; transition:.25s; max-width:86vw; text-align:center; }
  #toast.show { opacity:1; transform:translateX(-50%) translateY(0); }

  .maplibregl-canvas-container { position:absolute; left:0; top:0; }
  .maplibregl-popup-content { background:var(--sheet); color:var(--text); border-radius:12px; padding:12px;
    box-shadow:0 4px 20px rgba(0,0,0,.3); font-family:inherit; }
  .maplibregl-popup-tip { border-top-color:var(--sheet); }
  .mp-t { font-size:14px; margin-bottom:10px; white-space:pre-wrap; }
  .mp .btn { min-height:44px; }
</style>
</head>
<body>

<div id="map"></div>
<div id="fatal">
  <div>
    <div style="font-size:17px;font-weight:700;margin-bottom:8px">Карта не загрузилась</div>
    <div id="fatalReason"></div>
    <div class="diag" id="fatalInfo" style="text-align:left"></div>
    <div class="row2"><button class="btn primary" id="fatalRetry">Повторить</button></div>
  </div>
</div>
<div id="lpPulse"></div>
<div id="overlay"></div>

<div id="topbar">
  <div class="tb-row1">
    <div id="tbTitle">Самара — карта магазинов</div>
    <div class="searchwrap">
      <span id="searchIco"></span>
      <input id="search" type="search" placeholder="Поиск магазина или адреса" autocomplete="off">
    </div>
    <button class="ibtn" id="btnCollapse" aria-label="Свернуть панель"></button>
    <button class="ibtn" id="btnSettings" aria-label="Настройки"></button>
  </div>
  <div class="tb-row2">
    <button class="chip on" id="chAll">Все</button>
    <button class="chip" id="chMag">Магнит</button>
    <button class="chip" id="chPyat">Пятёрочка</button>
    <button class="chip" id="tgCam">Только с камерами</button>
    <button class="chip" id="tgFav">Только избранные</button>
    <button class="chip on" id="tgMarks">Метки</button>
  </div>
</div>
<div id="drop"></div>

<div class="ctl ctl-left">
  <button class="cbtn" id="btnQuick" aria-label="Быстрые настройки"></button>
</div>
<div class="ctl ctl-right">
  <button class="cbtn" id="btnFit" aria-label="Показать все магазины"></button>
  <button class="cbtn" id="btnCompass" aria-label="На север" hidden></button>
</div>
<button id="btnLocate" aria-label="Я здесь"></button>

<div class="sheet" id="sheetStore">
  <div class="sh-head">
    <button class="ibtn" id="stStar" aria-label="Избранное"></button>
    <h2 id="stName"></h2>
    <button class="ibtn" id="stClose" aria-label="Закрыть"></button>
  </div>
  <div class="sh-sub" id="stType"></div>
  <div class="seg" id="segChain" style="margin-top:8px">
    <button data-t="magnit">Магнит</button><button data-t="pyaterochka">Пятёрочка</button>
  </div>
  <div class="addr" id="stAddr" style="margin-top:10px"></div>
  <div class="lbl">Мои заметки</div>
  <textarea id="stNote" placeholder="Заметка о магазине..."></textarea>
  <label class="ck" id="ckCam"><input type="checkbox" id="stCam"><span class="box" id="ckCamBox"></span>Есть камеры видеонаблюдения</label>
  <label class="ck" id="ckVisit"><input type="checkbox" id="stVisit"><span class="box" id="ckVisitBox"></span>Был сегодня в этом магазине</label>
  <div class="lbl">Фотографии</div>
  <div class="ph-grid" id="phGrid"></div>
  <div class="row2">
    <button class="btn" id="phCam"></button>
    <button class="btn" id="phGal"></button>
  </div>
  <input type="file" id="inCam" accept="image/*" capture="environment" hidden>
  <input type="file" id="inGal" accept="image/*" hidden>
  <div class="meta" id="stMeta" hidden></div>
  <div class="row2">
    <button class="btn primary" id="stRoute"></button>
    <button class="btn" id="stCopy"></button>
  </div>
  <div class="row2">
    <button class="btn primary" id="stSave">Сохранить</button>
    <button class="btn" id="stClose2">Закрыть</button>
  </div>
  <div class="row2"><button class="btn danger" id="stDelete"></button></div>
</div>

<div class="sheet" id="sheetSettings">
  <div class="sh-head"><h2>Настройки</h2><button class="ibtn" id="setClose" aria-label="Закрыть"></button></div>
  <div class="lbl">Тема</div>
  <div class="seg" id="segTheme">
    <button data-t="light">Светлая</button><button data-t="dark">Тёмная</button><button data-t="auto">Как в системе</button>
  </div>
  <div class="row2"><button class="btn" id="setExport"></button></div>
  <div class="row2"><button class="btn" id="setImport"></button></div>
  <input type="file" id="inImport" accept=".json" hidden>
  <div class="row2"><button class="btn danger" id="setWipe">Очистить всё</button></div>
  <div class="diag" id="diag"></div>
  <div class="meta">Версия 1.4.1 (сборка под APK / WebView)<br>Долгое нажатие на карте — поставить метку</div>
</div>

<div class="sheet" id="sheetQuick">
  <div class="sh-head"><h2>Быстрые настройки</h2><button class="ibtn" id="qClose" aria-label="Закрыть"></button></div>
  <div class="lbl">Тема карты</div>
  <div class="seg" id="segThemeQ">
    <button data-t="light">Светлая</button><button data-t="dark">Тёмная</button><button data-t="auto">Как в системе</button>
  </div>
  <div class="swrow"><span>Отслеживание геопозиции</span><button class="sw" id="swTrack" aria-label="Слежение"></button></div>
</div>

<div class="sheet" id="sheetMark">
  <div class="sh-head"><h2>Новая метка</h2><button class="ibtn" id="mkClose" aria-label="Закрыть"></button></div>
  <div class="icgrid" id="mkGrid"></div>
  <div class="lbl">Название / описание</div>
  <textarea id="mkText" placeholder="Описание метки..."></textarea>
  <div id="mkAddrWrap" hidden>
    <div class="lbl">Адрес (необязательно)</div>
    <input class="inp" id="mkAddr" type="text">
  </div>
  <div class="row2">
    <button class="btn primary" id="mkOk">Поставить метку</button>
    <button class="btn" id="mkCancel">Отмена</button>
  </div>
</div>

<div id="viewer">
  <button class="vbtn" id="vClose" aria-label="Закрыть"></button>
  <button class="vbtn" id="vPrev" aria-label="Назад"></button>
  <img id="vImg" alt="">
  <button class="vbtn" id="vNext" aria-label="Вперёд"></button>
</div>

<div id="geoBanner">
  <span id="geoMsg"></span>
  <button class="btn primary" id="geoBtn">Разрешить</button>
  <button class="ibtn" id="geoX" aria-label="Закрыть">×</button>
</div>

<div id="toast"></div>

<script>
"use strict";

function $(id) { return document.getElementById(id); }

var ICONS = {
  pin:'<path d="M12 21s-7-5.2-7-11a7 7 0 1 1 14 0c0 5.8-7 11-7 11z"/><circle cx="12" cy="10" r="2.5"/>',
  home:'<path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/><path d="M10 20v-6h4v6"/>',
  star:'<path d="M12 3l2.7 5.5 6.1.9-4.4 4.3 1 6-5.4-2.9-5.4 2.9 1-6L3.2 9.4l6.1-.9z"/>',
  warning:'<path d="M12 3L2 20h20z"/><path d="M12 10v4"/><path d="M12 17.5v.5"/>',
  toilet:'<path d="M6 3h5v6H6z"/><path d="M6 9h12v2a6 6 0 0 1-6 6h-1a6 6 0 0 1-5-6V9z"/><path d="M10 17v4h3"/>',
  parking:'<rect x="3" y="3" width="18" height="18" rx="2"/><path d="M9 17V7h4a3 3 0 0 1 0 6H9"/>',

// Смена темы БЕЗ перезагрузки стиля: один раз запоминаем исходные paint-свойства
// базовых слоёв, а тему переключаем точечной правкой свойств. setStyle больше не
// используется — именно он при перезагрузке убирал наши слои с магазинами.
var lightPaint = null;

function captureLightPaint(m) {
  lightPaint = {};
  var st = null; try { st = m.getStyle(); } catch(e){}
  if (!st || !st.layers) return;
  st.layers.forEach(function(L) {
    var rec = {};
    var copy = function(k) { try { var v = m.getPaintProperty(L.id, k); if (v !== undefined) rec[k] = v; } catch(e){} };
    if (L.type === 'background') copy('background-color');
    else if (L.type === 'fill') { copy('fill-color'); copy('fill-outline-color'); }
    else if (L.type === 'line') copy('line-color');
    else if (L.type === 'symbol') { copy('text-color'); copy('text-halo-color'); }
    lightPaint[L.id] = rec;
  });
}

function patchDark(m) {
  if (!lightPaint) captureLightPaint(m);
  var style = null; try { style = m.getStyle(); } catch(e){}
  if (!style || !style.layers) return;
  var set = function(id, obj) { for (var k in obj) { try { m.setPaintProperty(id, k, obj[k]); } catch(e){} } };
  style.layers.forEach(function(L) {
    var id = L.id, t = L.type;
    if (t === 'background') set(id, { 'background-color': '#2b3540' });
    else if (t === 'fill') {
      if (/water|river|ocean|sea/.test(id)) set(id, { 'fill-color': '#222b35' });
      else if (/park|forest|grass|green|garden|cemetery|pitch|island/.test(id)) set(id, { 'fill-color': '#1d453a' });
      else if (/building/.test(id)) set(id, { 'fill-color': '#3a4552', 'fill-outline-color': '#313b47' });
    } else if (t === 'line') {
      if (/water|river/.test(id)) set(id, { 'line-color': '#222b35' });
      else if (/motorway|trunk|primary|secondary|tertiary/.test(id)) set(id, { 'line-color': '#5a6b85' });
      else if (/transport|road|street|highway|path|track|steps|footway|pedestrian|service|minor|residential/.test(id)) set(id, { 'line-color': '#46536a' });
    } else if (t === 'symbol') {
      if (/poi|amenity|shop|station/.test(id)) set(id, { 'text-color': '#8b96a5', 'text-halo-color': 'rgba(20,26,32,.6)' });
      else set(id, { 'text-color': '#c3ccd8', 'text-halo-color': 'rgba(20,26,32,.6)' });
    }
  });
}

function patchLight(m) {
  if (!lightPaint) return;
  for (var id in lightPaint) {
    var rec = lightPaint[id];
    for (var k in rec) { try { m.setPaintProperty(id, k, rec[k]); } catch(e){} }
  }
}

// --- Иконки для слоёв карты: SVG -> ImageData -> map.addImage ---
var IMG_CACHE = {};
function renderGlyph(name, key) {
  var svg = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="48" height="48" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">' + ICONS[name] + '</svg>';
  var img = new Image();
  img.onload = function() {
    try {
      var c = document.createElement('canvas'); c.width = 48; c.height = 48;
      var ctx = c.getContext('2d'); ctx.drawImage(img, 0, 0, 48, 48);
      IMG_CACHE[key] = ctx.getImageData(0, 0, 48, 48);
      addMapImages();
    } catch (e) {}
  };
  img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
}
function addMapImages() {
  if (!map) return;
  for (var k in IMG_CACHE) {
    try { if (!map.hasImage(k)) map.addImage(k, IMG_CACHE[k], { pixelRatio: 2 }); } catch (e) {}
  }
}

function storeFeature(s) {
  var sd = storeData(s.id);
  return { type: 'Feature',
    geometry: { type: 'Point', coordinates: [s.lng, s.lat] },
    properties: { id: s.id, type: sd.t || s.type, name: s.name || '', address: s.address || '',
      cam: sd.cameras ? 1 : 0, vis: visitIsToday(sd) ? 1 : 0,
      note: sd.note.trim() ? 1 : 0, fav: isFav(s.id) ? 1 : 0 } };
}

function rebuildStores() {
  if (!map || !map.getSource('stores')) return;
  var feats = [];
  var all = allStores();
  for (var i = 0; i < all.length; i++) feats.push(storeFeature(all[i]));
  map.getSource('stores').setData({ type: 'FeatureCollection', features: feats });
}

function rebuildMarks() {
  if (!map || !map.getSource('marks')) return;
  var feats = [];
  var um = userMarks();
  for (var i = 0; i < um.length; i++) {
    feats.push({ type: 'Feature',
      geometry: { type: 'Point', coordinates: [um[i].lng, um[i].lat] },
      properties: { id: um[i].id, icon: um[i].icon || 'pin', text: um[i].text || '' } });
  }
  map.getSource('marks').setData({ type: 'FeatureCollection', features: feats });
}

function refreshBadges() { rebuildStores(); }

function ensureStoresLayers() {

  if (!map.getLayer('st-pin')) map.addLayer({
    id: 'st-pin', type: 'circle', source: 'stores',
    paint: {
      'circle-color': ['match', ['get', 'type'], 'magnit', '#d32f2f', '#2e7d32'],
      'circle-radius': ['interpolate', ['linear'], ['zoom'], 11, 11, 16, 17],
      'circle-stroke-color': '#ffffff',
      'circle-stroke-width': 2.5,
      'circle-opacity': 0.95

  // Бейдж «был сегодня»: зелёный кружок с галочкой справа снизу
  if (!map.getLayer('st-vis')) map.addLayer({

    filter: ['==', ['get', 'vis'], 1],

    filter: ['==', ['get', 'vis'], 1],
    layout: { 'icon-image': 'badge-check', 'icon-size': 0.5, 'icon-allow-overlap': true, 'icon-ignore-placement': true },
    paint: { 'icon-translate': [14, 14] }
  });
  // Бейдж «есть заметка»: маленький синий кружок слева снизу
  if (!map.getLayer('st-note')) map.addLayer({
    id: 'st-note', type: 'circle', source: 'stores',
    filter: ['==', ['get', 'note'], 1],
    paint: {
      'circle-color': '#1976d2', 'circle-radius': 6.5,
      'circle-translate': [-14, 14],

    }
  });
  if (!map.getLayer('st-cam')) map.addLayer({

function storeFilter() {
  var f = ['all'];
  if (state.chain !== 'all') f.push(['==', ['get', 'type'], state.chain]);
  if (state.camOnly) f.push(['==', ['get', 'cam'], 1]);
  if (state.favOnly) f.push(['==', ['get', 'fav'], 1]);
  return f;
}

function combineFilter(base, extra) { var f = base.slice(); f.push(extra); return f; }

function applyFilters() {
  if (!map) return;
  var sf = storeFilter();
  var defs = [
    ['st-pin', sf],
    ['st-cam', combineFilter(sf, ['==', ['get', 'cam'], 1])],
    ['st-cambang', combineFilter(sf, ['==', ['get', 'cam'], 1])],
    ['st-vis', combineFilter(sf, ['==', ['get', 'vis'], 1])],
    ['st-vischeck', combineFilter(sf, ['==', ['get', 'vis'], 1])],
    ['st-note', combineFilter(sf, ['==', ['get', 'note'], 1])]
  ];
  for (var i = 0; i < defs.length; i++) {
    if (map.getLayer(defs[i][0])) map.setFilter(defs[i][0], defs[i][1]);
  }
  var mf = state.marksOn ? ['has', 'id'] : ['==', ['get', 'id'], '__none__'];
  if (map.getLayer('mk-dot')) map.setFilter('mk-dot', mf);
  if (map.getLayer('mk-icon')) map.setFilter('mk-icon', mf);
}

function copyText(txt) {
  var done = function() { toast('Скопировано'); };
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(txt).then(done).catch(function() { if (legacyCopy(txt)) done(); else toast('Не удалось скопировать'); });
  } else if (legacyCopy(txt)) done(); else toast('Не удалось скопировать');
}

}

    if (saveStoreData(curStoreId, s2)) { renderPhotos(); toast('Фото добавлено'); }
  });

function compressImage(file, cb) {
  var finish = function(src) {
    var img = new Image();
    img.onload = function() {
      var max = 1280;
      var w = img.width, h = img.height;
      var k = Math.min(1, max / Math.max(w, h));
      w = Math.max(1, Math.round(w * k)); h = Math.max(1, Math.round(h * k));
      var c = document.createElement('canvas'); c.width = w; c.height = h;
      c.getContext('2d').drawImage(img, 0, 0, w, h);
      cb(c.toDataURL('image/jpeg', 0.75));
    };
    img.onerror = function() { cb(null); };
    img.src = src;
  };
  var viaReader = function() {
    var fr = new FileReader();
    fr.onload = function() { finish(fr.result); };
    fr.onerror = function() { cb(null); };
    fr.readAsDataURL(file);
  };
  if (window.createImageBitmap) {
    createImageBitmap(file, { imageOrientation: 'from-image' })
      .then(function(bmp) {
        var max = 1280;
        var w = bmp.width, h = bmp.height;
        var k = Math.min(1, max / Math.max(w, h));
        w = Math.max(1, Math.round(w * k)); h = Math.max(1, Math.round(h * k));
        var c = document.createElement('canvas'); c.width = w; c.height = h;
        c.getContext('2d').drawImage(bmp, 0, 0, w, h);
        cb(c.toDataURL('image/jpeg', 0.75));
      })
      .catch(viaReader);
  } else {
    viaReader();
  }
}

var lpTimer = null, lpStart = null, lpPending = null;
var lpPulse = $('lpPulse');

function cancelLP() {
  if (lpTimer) { clearTimeout(lpTimer); lpTimer = null; }
  lpStart = null; lpPending = null; lpPulse.style.display = 'none';
}

function fireLP() {
  lpFireAt = Date.now();
  lpPulse.style.display = 'none';
  if (navigator.vibrate) { try { navigator.vibrate(30); } catch(e){} }
  var ll = lpPending;
  lpTimer = null; lpStart = null; lpPending = null;
  if (ll) openMarkModal(ll);
}

function setupLongPress() {
  if (!map) return;
  var mc = map.getCanvas();
  mc.addEventListener('contextmenu', function(e) { e.preventDefault(); });
  mc.addEventListener('touchstart', function(e) {
    if (!geoAsked) requestGeoOnce();
    if (e.touches.length !== 1) { cancelLP(); return; }
    var t = e.touches[0];
    var rect = mc.getBoundingClientRect();
    lpStart = { x: t.clientX, y: t.clientY };
    lpPending = map.unproject([t.clientX - rect.left, t.clientY - rect.top]);
    lpPulse.style.left = t.clientX + 'px'; lpPulse.style.top = t.clientY + 'px';
    lpPulse.style.display = 'block';
    lpTimer = setTimeout(fireLP, 600);
  }, { passive: true });
  mc.addEventListener('touchmove', function(e) {
    if (!lpStart) return;
    var t = e.touches[0];
    var dx = t.clientX - lpStart.x, dy = t.clientY - lpStart.y;
    if (Math.sqrt(dx*dx + dy*dy) > 10) cancelLP();
  }, { passive: true });
  mc.addEventListener('touchend', cancelLP, { passive: true });
  mc.addEventListener('touchcancel', cancelLP, { passive: true });
  map.on('movestart', cancelLP);
  map.on('zoomstart', cancelLP);
}

// === Нативный мост геолокации оболочки (HTML to APK Builder) ===
// AndroidAPI.requestPermission / hasPermission / getLocation / startLocationUpdates.
// Ответы приходят через window.onAndroidEvent(event, data).
var GEO_PERM = 'android.permission.ACCESS_FINE_LOCATION';
var bridgeCb = 0;
function cbId() { return 'cb' + (++bridgeCb); }

function hasGeoBridge() {
  try { return !!(window.AndroidAPI && typeof window.AndroidAPI.getLocation === 'function'); } catch(e) { return false; }
}

// Кнопка «Разрешить»: запрашиваем разрешение, затем фикс позиции.
function bridgeAsk() {
  try { if (typeof AndroidAPI.requestPermission === 'function') AndroidAPI.requestPermission(GEO_PERM, cbId()); } catch(e) {}
  setTimeout(function() { requestGeo(true); }, 800);
}

function handleBridgeErr(err) {
  if (err === 'permission_denied' || err === 'permission_revoked') {
    setTracking(false, true);
    showGeoBanner('Нажмите «Разрешить» — приложение запросит доступ к геопозиции, как сайт в браузере', 'Разрешить');
  } else if (err === 'provider_disabled') {
    toast('Включите геопозицию (GPS) на телефоне');
  } else if (err === 'pro_required') {
    // Геолокация через мост — платная функция билдера (бесплатная версия отказывает).
    setTracking(false, true);
    showGeoBanner('Билдер отклоняет геолокацию: нужна Pro-версия HTML to APK Builder. Как сайт в браузере всё работает.', 'Повторить');
  }
  // timeout / superseded — молча, последует следующий запрос
}

// Распознаём разные форматы ответа: объект или JSON-строка, поля lat/latitude и т.п.
function parseBridgeLoc(d) {
  try {
    if (typeof d === 'string') { try { d = JSON.parse(d); } catch(e1) { return null; } }
    if (!d || typeof d !== 'object') return null;
    if (d.success === false) return null;
    var lat = d.latitude != null ? d.latitude : (d.lat != null ? d.lat : null);
    var lng = d.longitude != null ? d.longitude : (d.lng != null ? d.lng : (d.lon != null ? d.lon : null));
    if (lat == null || lng == null) return null;
    var acc = d.accuracy != null ? d.accuracy : (d.acc != null ? d.acc : 30);
    return { latitude: parseFloat(lat), longitude: parseFloat(lng), accuracy: parseFloat(acc) || 30 };
  } catch(e) { return null; }
}

var prevOnAndroidEvent = window.onAndroidEvent;
var ourAndroidHandler = function(e, d) {
  var firstEvt = !evtLog.length;
  try {
    var s = e + ': ' + (typeof d === 'object' && d !== null ? JSON.stringify(d) : String(d));
    evtLog.push(s.length > 170 ? s.slice(0, 170) + '…' : s);
    if (evtLog.length > 8) evtLog.shift();
  } catch(_) {}
  try { if (prevOnAndroidEvent) prevOnAndroidEvent(e, d); } catch(e0) {}
  if (e === 'proRequired') { handleBridgeErr('pro_required'); return; }
  if (e !== 'locationResult' && e !== 'locationUpdate') return;
  var coords = parseBridgeLoc(d);
  if (coords) {
    if (!lastPos) toast('Местоположение определено');
    onPos({ coords: coords });
    if (bridgePending) {
      var cb = bridgePending;
      bridgePending = null;
      clearTimeout(cb.timer);
      if (cb.fromUser && map) map.flyTo({ center: [coords.longitude, coords.latitude], zoom: 16 });
    }
    return;
  }
  if (d && d.error) handleBridgeErr(d.error);
  if (firstEvt) toast('Событие моста: ' + e);
};
window.onAndroidEvent = ourAndroidHandler;
// Если оболочка перезапишет обработчик после нас — возвращаем наш.
[800, 2500, 6000].forEach(function(ms) {
  setTimeout(function() {
    if (window.onAndroidEvent !== ourAndroidHandler) {
      prevOnAndroidEvent = window.onAndroidEvent;
      window.onAndroidEvent = ourAndroidHandler;
    }
  }, ms);
});
var btnLocate = $('btnLocate');

function ensureGeoLayers() {
  if (!map) return;
  try {
    if (!map.getSource('acc')) map.addSource('acc', { type: 'geojson', data: { type: 'FeatureCollection', features: [] } });
    if (!map.getLayer('acc-fill')) map.addLayer({ id: 'acc-fill', type: 'fill', source: 'acc',
      paint: { 'fill-color': '#1976d2', 'fill-opacity': 0.12 } });
    if (!map.getLayer('acc-line')) map.addLayer({ id: 'acc-line', type: 'line', source: 'acc',
      paint: { 'line-color': '#1976d2', 'line-opacity': 0.4, 'line-width': 1.5 } });
    if (!map.getLayer('geo-dot')) map.addLayer({ id: 'geo-dot', type: 'circle', source: 'acc',
      filter: ['==', ['get', 'dot'], 1],
      paint: { 'circle-color': '#1976d2', 'circle-radius': 9, 'circle-stroke-color': '#ffffff', 'circle-stroke-width': 3 } });
  } catch(e) { /* стиль ещё не загружен — слои добавятся в style.load */ }
}

function circleGeo(lon, lat, r) {
  var pts = [];
  var dLat = r / 111320, dLng = r / (111320 * Math.cos(lat * Math.PI / 180));
  for (var i = 0; i <= 64; i++) {
    var a = (i / 64) * Math.PI * 2;
    pts.push([lon + dLng * Math.cos(a), lat + dLat * Math.sin(a)]);
  }
  return { type: 'Feature', geometry: { type: 'Polygon', coordinates: [pts] }, properties: {} };
}

// --- Баннер запроса геолокации ---
function showGeoBanner(msg, btn) {
  $('geoMsg').textContent = msg;
  $('geoBtn').textContent = btn;
  $('geoBanner').style.display = 'flex';
}
function hideGeoBanner() { $('geoBanner').style.display = 'none'; }

function onPos(p) {
  lastPos = p.coords;
  hideGeoBanner();
  if (!map) return;
  ensureGeoLayers();
  try {
    map.getSource('acc').setData({ type: 'FeatureCollection', features: [
      circleGeo(lastPos.longitude, lastPos.latitude, lastPos.accuracy || 30),
      { type: 'Feature', geometry: { type: 'Point', coordinates: [lastPos.longitude, lastPos.latitude] }, properties: { dot: 1 } }
    ]});
  } catch(e){}
}

function onGeoErr(e) {
  if (e.code === 1) {
    setTracking(false, true);
    showGeoBanner('Доступ к геолокации запрещён. Разрешите его в настройках телефона: Приложения → Местоположение.', 'Повторить');
  }
  else if (e.code === 2) toast('Геолокация недоступна');
  else if (e.code === 3) toast('Превышено время ожидания');
  else toast('Не удалось определить местоположение');
}

function startWatch() {
  if (watchId != null || !map) return;
  if (hasGeoBridge()) {
    try { AndroidAPI.startLocationUpdates(cbId()); } catch(e) {}
    // Резерв: браузерные фиксы параллельно — если мост молчит, слежение всё равно работает.
    if ('geolocation' in navigator) {
      try {
        navWatchBackup = navigator.geolocation.watchPosition(onPos, function() {}, { enableHighAccuracy: true, maximumAge: 1000, timeout: 20000 });
      } catch(e) {}
    }
    watchId = -1; // слежение активно (режим моста)
    return;
  }
  if (!('geolocation' in navigator)) { toast('Геолокация недоступна в оболочке'); return; }
  watchId = navigator.geolocation.watchPosition(onPos, onGeoErr, { enableHighAccuracy: true, maximumAge: 1000, timeout: 15000 });
}

function stopWatch() {
  if (watchId === -1) {
    try { if (window.AndroidAPI && AndroidAPI.stopLocationUpdates) AndroidAPI.stopLocationUpdates(); } catch(e) {}
    if (navWatchBackup != null && 'geolocation' in navigator) { try { navigator.geolocation.clearWatch(navWatchBackup); } catch(e){} navWatchBackup = null; }
    watchId = null;
    return;
  }
  if (watchId != null && 'geolocation' in navigator) { try { navigator.geolocation.clearWatch(watchId); } catch(e){} }
  watchId = null;
}

function removeGeoVisuals() {
  try {
    if (map && map.getSource('acc')) map.getSource('acc').setData({ type: 'FeatureCollection', features: [] });
  } catch(e){}
}

function setTracking(on, silent) {
  state.tracking = !!on;
  LS.set('tracking_enabled', state.tracking);
  btnLocate.classList.toggle('trk', state.tracking);
  var sw = $('swTrack'); if (sw) sw.classList.toggle('on', state.tracking);
  if (state.tracking) startWatch(); else { stopWatch(); removeGeoVisuals(); }
  if (!silent) toast(state.tracking ? 'Слежение включено' : 'Слежение выключено');
}

state.tracking = LS.get('tracking_enabled', true);

var locLpTimer = null, locLpFired = false;
btnLocate.addEventListener('pointerdown', function() {
  locLpFired = false;
  locLpTimer = setTimeout(function() { locLpFired = true; if (navigator.vibrate) { try { navigator.vibrate(30); } catch(e){} } setTracking(!state.tracking); }, 500);
});
['pointerup','pointercancel','pointerleave'].forEach(function(ev) { btnLocate.addEventListener(ev, function() { clearTimeout(locLpTimer); }); });

btnLocate.addEventListener('click', function(e) {
  if (locLpFired) { locLpFired = false; e.preventDefault(); return; }
  if (lastPos) { if (map) map.flyTo({ center: [lastPos.longitude, lastPos.latitude], zoom: 16 }); }
  else requestGeo(true);
});

document.addEventListener('visibilitychange', function() {
  if (document.hidden) { if (watchId != null) { stopWatch(); geoPaused = true; } }
  else if (geoPaused && state.tracking) { geoPaused = false; startWatch(); }
});

// Запрос геолокации: в APK идём через нативный мост оболочки, параллельно
// пробуем и браузерный путь — после выданного системного разрешения он тоже
// может работать. Что ответит первым, то и используем.
function requestGeo(fromUser) {
  if (hasGeoBridge()) {
    if (fromUser && !state.tracking) setTracking(true, true);
    // Разрешение запрашиваем всегда: если уже выдано — оболочка ответит мгновенно или проигнорирует.
    try {
      if (typeof AndroidAPI.hasPermission === 'function' && !AndroidAPI.hasPermission(GEO_PERM)) {
        AndroidAPI.requestPermission(GEO_PERM, cbId());
      }
    } catch(e) {}
    if (bridgePending) clearTimeout(bridgePending.timer);
    bridgePending = { fromUser: fromUser, timer: setTimeout(function() {
      bridgePending = null;
      if (fromUser) toast('Не удалось получить местоположение');
    }, 15000) };
    try { AndroidAPI.getLocation(cbId()); } catch(e) { clearTimeout(bridgePending.timer); bridgePending = null; }
    tryNavGeo(fromUser, true);
    return;
  }
  tryNavGeo(fromUser, false);
}

function tryNavGeo(fromUser, bridgeExists) {
  if (!('geolocation' in navigator)) {
    if (!bridgeExists) showGeoBanner('Геолокация недоступна в этой оболочке', 'ОК');
    return;
  }
  if (fromUser && !state.tracking) setTracking(true, true);
  navigator.geolocation.getCurrentPosition(
    function(p) {
      onPos(p);
      if (state.tracking && watchId == null && !hasGeoBridge()) startWatch();
      if (fromUser && map) map.flyTo({ center: [p.coords.longitude, p.coords.latitude], zoom: 16 });
    },
    function(e) { if (!bridgeExists && (fromUser || e.code === 1)) onGeoErr(e); },
    { enableHighAccuracy: true, timeout: 15000, maximumAge: 60000 }
  );
}

function requestGeoOnce() {
  if (geoAsked) return;
  geoAsked = true;
  requestGeo(false);
}

// Ждём появления моста, затем запускаем слежение и первый фикс; далее —
// периодический повтор getLocation, пока первый фикс не получен.
function initGeoWhenReady() {
  var tries = 0;
  var t = setInterval(function() {
    tries++;
    if (hasGeoBridge() || tries >= 10) {
      clearInterval(t);
      if (state.tracking) startWatch();
      requestGeoOnce();
      if (hasGeoBridge()) bridgeKick();
    }
  }, 500);
}

function bridgeKick() {
  if (bridgeRetry || lastPos || !hasGeoBridge()) return;
  bridgeRetry = setInterval(function() {
    if (lastPos || !hasGeoBridge()) { clearInterval(bridgeRetry); bridgeRetry = null; return; }
    try { AndroidAPI.getLocation(cbId()); } catch(e) {}
  }, 15000);
}

$('geoBtn').addEventListener('click', function() {
  if (hasGeoBridge()) { bridgeAsk(); return; }
  requestGeo(true);
});
$('geoX').addEventListener('click', hideGeoBanner);

// Смена темы: точечный патч свойств, без перезагрузки стиля.
function applyTheme() {
  var r = resolvedTheme();
  document.documentElement.setAttribute('data-theme', r);
  if (map) { try { if (r === 'dark') patchDark(map); else patchLight(map); } catch(e){} }
  updateThemeUI();
}

function updateThemeUI() {
  var t = LS.get('theme', 'auto');
  var segs = ['segTheme','segThemeQ'];
  for (var i = 0; i < segs.length; i++) {
    var seg = $(segs[i]); if (!seg) continue;
    var btns = seg.querySelectorAll('button');
    for (var j = 0; j < btns.length; j++) { btns[j].classList.toggle('on', btns[j].dataset.t === t); }
  }
}

var segIds = ['segTheme','segThemeQ'];
for (var si = 0; si < segIds.length; si++) {
  (function(sid) {
    var seg = $(sid);
    var btns = seg.querySelectorAll('button');
    for (var j = 0; j < btns.length; j++) {
      btns[j].addEventListener('click', function() { LS.set('theme', this.dataset.t); applyTheme(); });
    }
  })(segIds[si]);
}

if (mqDark.addEventListener) mqDark.addEventListener('change', function() { if (LS.get('theme', 'auto') === 'auto') applyTheme(); });

$('btnSettings').addEventListener('click', function() { buildDiag(); openSheet($('sheetSettings')); });
$('setClose').addEventListener('click', function() { closeSheetBack($('sheetSettings')); });
$('btnQuick').addEventListener('click', function() { updateThemeUI(); $('swTrack').classList.toggle('on', state.tracking); openSheet($('sheetQuick')); });
$('qClose').addEventListener('click', function() { closeSheetBack($('sheetQuick')); });
$('swTrack').addEventListener('click', function() { setTracking(!state.tracking); });



$('setExport').addEventListener('click', function() {
  var data = {};
  var keys = appKeyList();
  for (var i = 0; i < keys.length; i++) { try { data[keys[i]] = JSON.parse(localStorage.getItem(keys[i])); } catch(e){} }
  var blob = new Blob([JSON.stringify({ app: 'samara-map', version: 1, exportedAt: Date.now(), data: data }, null, 2)], { type: 'application/json' });
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'samara-map-backup-' + todayStr() + '.json';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(function() { URL.revokeObjectURL(a.href); }, 3000);
  toast('Экспорт готов');
});

$('setImport').addEventListener('click', function() { $('inImport').click(); });
$('inImport').addEventListener('change', function(e) {
  var f = e.target.files[0]; e.target.value = '';
  if (!f) return;
  var fr = new FileReader();
  fr.onload = function() {
    try {
      var obj = JSON.parse(fr.result);
      if (!obj || typeof obj.data !== 'object') { toast('Неверный формат файла'); return; }
      if (!confirm('Заменить все текущие данные?')) return;
      var keys = appKeyList();
      for (var i = 0; i < keys.length; i++) LS.remove(keys[i]);
      var objKeys = Object.keys(obj.data);
      for (var j = 0; j < objKeys.length; j++) LS.set(objKeys[j], obj.data[objKeys[j]]);
      location.reload();
    } catch(err) { toast('Ошибка чтения JSON'); }
  };
  fr.onerror = function() { toast('Ошибка чтения файла'); };
  fr.readAsText(f);
});

$('setWipe').addEventListener('click', function() {
  if (!confirm('Очистить все данные приложения?')) return;
  if (!confirm('Точно? Действие необратимо.')) return;
  var keys = appKeyList();
  for (var i = 0; i < keys.length; i++) LS.remove(keys[i]);
  location.reload();
});

function buildDiag() {
  var lsOk = true;
  try { localStorage.setItem('__t', '1'); localStorage.removeItem('__t'); } catch(e) { lsOk = false; }
  var ua = (navigator.userAgent.match(/Version\/[\d.]+|Chrome\/[\d.]+/g) || []).join(' ');
  $('diag').innerHTML =
    'Оболочка: ' + (ua || 'неизвестно') + '<br>' +
    'localStorage: ' + (lsOk ? 'ок' : 'ОШИБКА') + '<br>' +
    'Geolocation API: ' + ('geolocation' in navigator ? 'ок' : 'отсутствует') + '<br>' +
    'Безопасный контекст (https): ' + (window.isSecureContext ? 'да' : 'нет') + '<br>' +
    'Мост AndroidAPI: ' + (typeof window.AndroidAPI === 'undefined' ? 'нет' : (hasGeoBridge() ? 'есть (getLocation ок)' : 'есть, getLocation недоступен')) + '<br>' +
    'Позиция: ' + (lastPos ? (lastPos.latitude.toFixed(5) + ', ' + lastPos.longitude.toFixed(5)) : 'нет') + '<br>' +
    'Слой geo-dot: ' + (map && map.getLayer('geo-dot') ? 'есть' : 'нет') + '<br>' +
    'События моста:<br>' + (evtLog.length ? evtLog.join('<br>') : '&lt;не приходили&gt;') + '<br>' +
    'Магазинов на карте: ' + allStores().length + '<br>' +
    'Данные: ' + lsSizeKB() + ' КБ';
}

function lsSizeKB() { var t = 0; var keys = appKeyList(); for (var i = 0; i < keys.length; i++) { try { t += localStorage.getItem(keys[i]).length; } catch(e){} } return Math.round(t * 2 / 1024); }

$('btnFit').addEventListener('click', function() {
  if (!map) return;
  var fav = favorites();
  var pts = [];
  var all = allStores();
  for (var i = 0; i < all.length; i++) {
    var s = all[i];
    if (!(state.chain === 'all' || s.type === state.chain)) continue;
    var sd = storeData(s.id);
    if (state.camOnly && !sd.cameras) continue;
    if (state.favOnly && fav.indexOf(s.id) < 0) continue;
    pts.push([s.lng, s.lat]);
  }
  if (!pts.length) { toast('Нет магазинов для показа'); return; }
  var b = new maplibregl.LngLatBounds();
  for (var j = 0; j < pts.length; j++) b.extend(pts[j]);
  map.fitBounds(b, { padding: { top: 150, bottom: 90, left: 50, right: 50 }, maxZoom: 15 });
});

function syncTopbar() {
  var h = $('topbar').offsetHeight;
  document.documentElement.style.setProperty('--topbar-h', h + 'px');
}

function applyTopbarState() {
  var collapsed = LS.get('topbar_collapsed', false);
  $('topbar').classList.toggle('collapsed', collapsed);
  $('btnCollapse').innerHTML = icon('chev_up', 22);
  syncTopbar();
}

$('btnCollapse').addEventListener('click', function() {
  var now = $('topbar').classList.toggle('collapsed');
  LS.set('topbar_collapsed', now);
  syncTopbar();
  setTimeout(syncTopbar, 300);
});

// Принудительный resize карты: в WebView/APK событие resize часто не приходит
// или приходит до готовности вёрстки. Сторож раз в секунду ловит рассинхрон.
function forceResize() { if (map) { try { map.resize(); } catch (e) {} } }
window.addEventListener('load', function() {
  setTimeout(forceResize, 100);
  setTimeout(forceResize, 500);
});
window.addEventListener('orientationchange', function() { setTimeout(forceResize, 300); });
document.addEventListener('visibilitychange', function() {
  if (!document.hidden) setTimeout(forceResize, 150);
});
setInterval(function() {
  if (!map) return;
  try {
    var el = map.getCanvasContainer();
    var s = map.getSize();
    var mismatch = Math.abs(s.x - el.clientWidth) > 1 || Math.abs(s.y - el.clientHeight) > 1;
    if (!mismatch) {
      var cv = map.getCanvas();
      var dpr = window.devicePixelRatio || 1;
      var ew = Math.round(el.clientWidth * dpr), eh = Math.round(el.clientHeight * dpr);
      mismatch = Math.abs(cv.width - ew) > 2 || Math.abs(cv.height - eh) > 2;
    }
    if (mismatch) map.resize();
  } catch (e) {}
}, 1000);

function initUI() {
  $('searchIco').innerHTML = icon('search', 18);
  $('btnSettings').innerHTML = icon('settings', 22);
  $('btnQuick').innerHTML = icon('sliders', 22);
  $('btnFit').innerHTML = icon('expand', 22);
  $('btnCompass').innerHTML = icon('compass', 22);
  btnLocate.innerHTML = icon('locate', 26);
  $('stClose').innerHTML = icon('x', 22);
  $('setClose').innerHTML = icon('x', 22);
  $('qClose').innerHTML = icon('x', 22);
  $('mkClose').innerHTML = icon('x', 22);
  $('stRoute').innerHTML = icon('route', 18) + ' Маршрут';
  $('stCopy').innerHTML = icon('copy', 18) + ' Копировать адрес';
  $('phCam').innerHTML = icon('camera', 18) + ' Сделать фото';
  $('phGal').innerHTML = icon('image', 18) + ' Из галереи';
  $('setExport').innerHTML = icon('download', 18) + ' Экспорт данных';
  $('setImport').innerHTML = icon('upload', 18) + ' Импорт данных';
  $('vClose').innerHTML = icon('x', 22);
  $('vPrev').innerHTML = icon('chev_l', 22);

  applyTopbarState();
  setTimeout(syncTopbar, 350);

}

function onMapReady() {
  document.documentElement.setAttribute('data-theme', resolvedTheme());
  updateThemeUI();
  // Слои можно добавлять только к загруженному стилю: если стиль уже готов —
  // настраиваем сразу, иначе подождём style.load.
  if (map.isStyleLoaded && map.isStyleLoaded()) { try { setupLayers(); } catch (e) {} }
  refreshAllBadges();
  btnLocate.classList.toggle('trk', state.tracking);
  // Мост AndroidAPI оболочка инжектит с задержкой — ждём его до 5 секунд,
  // иначе всё молча уходило в запасной navigator.geolocation, которому тут нечего отвечать.
  initGeoWhenReady();
  // Если за 2.5 с позиции нет — показываем плашку с кнопкой «Разрешить»
  setTimeout(function() {
    if (!lastPos) showGeoBanner('Нажмите «Разрешить» — приложение запросит доступ к геопозиции, как сайт в браузере', 'Разрешить');
  }, 1500);
  setupLongPress();
  setInterval(refreshAllBadges, 60000);
  document.addEventListener('visibilitychange', refreshAllBadges);
  map.on('rotate', function() { $('btnCompass').hidden = Math.abs(map.getBearing()) < 0.5; });
  $('btnCompass').addEventListener('click', function() { map.easeTo({ bearing: 0, duration: 400 }); });
  map.on('click', function(e) {
    if (Date.now() - lpFireAt < 600) return;
    var sl = visibleStoreLayers();
    if (sl.length) {
      var sf = map.queryRenderedFeatures(e.point, { layers: sl });
      if (sf.length) { openStoreCard(sf[0].properties.id); return; }
    }
    if (state.marksOn && map.getLayer('mk-dot')) {
      var mf = map.queryRenderedFeatures(e.point, { layers: ['mk-dot'] });
      if (mf.length) { openMarkPopup(mf[0].properties); return; }
    }
  });
  map.on('mousemove', function(e) {
    var sl = visibleStoreLayers();
    var hit = sl.length ? map.queryRenderedFeatures(e.point, { layers: sl }) : [];
    map.getCanvas().style.cursor = hit.length ? 'pointer' : '';
  });
  var mvT = null;
  map.on('moveend', function() {
    clearTimeout(mvT);
    mvT = setTimeout(function() { LS.set('map_state', { c: map.getCenter().toArray(), z: map.getZoom() }); }, 500);
  });
}

initUI();

if (map) {
  map.on('style.load', function() {
    lightPaint = null;
    if (resolvedTheme() === 'dark') patchDark(map);
    addMapImages();
    setupLayers();
    if (lastPos) onPos({ coords: lastPos });
  });
  // Готовим картинки значков для слоёв (метки + галочка «был сегодня»)
  MARK_ICONS.forEach(function(n) { renderGlyph(n, 'mk-' + n); });
  renderGlyph('check', 'badge-check');
  onMapReady();
}
